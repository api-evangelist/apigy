description: Apigy, Inc. is the company behind Lockitron, an early keyless smart-lock
  startup that let people lock, unlock, and share access to their doors from a smartphone.
  Backed by 500 Startups (now 500 Global) and known for a large 2012 crowdfunding
  campaign, Apigy built connected door-lock hardware and companion mobile apps before
  the Lockitron product line was wound down. Surfaced as a 500 Global portfolio company
  and added to the API Evangelist network; its public website (lockitron.com) is
  currently unreachable and no active developer or API surface could be located.
